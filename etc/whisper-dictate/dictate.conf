# Системный конфиг whisper-dictate. Переопределяется ~/.config/whisper-dictate/dictate.conf
# и переменными окружения DICTATE_<КЛЮЧ>. Пустое значение = «не задано» (берётся дефолт).
# Секреты (API-ключи) сюда НЕ класть: см. secrets.env.example.

# Модель whisper (файл в MODEL_DIR) и VAD
#MODEL=ggml-large-v3-turbo.bin
#VAD_MODEL=ggml-silero-v5.1.2.bin
#MODEL_DIR=~/.local/share/whisper-dictate/models
#WHISPER_BIN=whisper-cli

# Распознавание: пусто = только локально; gemini | openrouter — облачный STT
#STT=
# Перевод: пусто = выключен; deepl | gemini | openrouter
#TRANSLATE_PROVIDER=
#GEMINI_MODEL=

# Подсказка whisper (термины, имена)
#PROMPT=

# Тайминги
#CHUNK_SECONDS=120
#WHISPER_ATTEMPTS=2
#WHISPER_RETRY_DELAY=4
#MOD_WAIT_SECONDS=6
#PENDING_TIMEOUT_SECONDS=900

# Ускоритель whisper: auto | vulkan | hip (ROCm) | cuda | cpu
#WHISPER_BACKEND=auto

# Связка секретов libsecret
#KEYRING_APP=illogical-impulse

# Интеграция с Quickshell ii (необязательно)
#STATE_FILE=~/.local/state/quickshell/states.json
#TRANSLATE_SCRIPT=~/.config/quickshell/ii/scripts/ai/local-translate.sh
# Каталог моделей OPUS-MT для локального перевода (скачиваются в GUI: Перевод).
#MT_MODEL_DIR=~/.local/share/whisper-dictate/mt-models
#LOG_FILE=~/.local/state/dictate/dictate.log
